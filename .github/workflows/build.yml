name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pull requests from branches of this repository already run on push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # The release build is unsigned here; it checks R8 and the release lint checks.
      - name: Unit tests, lint, debug and release builds
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v5
        with:
          name: stock-widget-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
