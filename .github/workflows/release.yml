name: Release

# Builds a signed release APK and publishes it as a GitHub release.
# Runs on a pushed version tag (v1.2.3), or from the Actions tab with a tag to create.
#
# Signing uses the repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and
# KEY_PASSWORD (see RELEASING.md). Until they exist, the APK is signed with a one-off key
# that is thrown away after the run, and the release is marked as a preview: such builds
# can't be updated in place by later releases.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create and release, e.g. v1.0.0
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Build and sign
        id: build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export SIGNING_STORE_FILE="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$SIGNING_STORE_FILE"
            export SIGNING_STORE_PASSWORD="$KEYSTORE_PASSWORD"
            export SIGNING_KEY_ALIAS="$KEY_ALIAS"
            export SIGNING_KEY_PASSWORD="$KEY_PASSWORD"
            echo "preview=false" >> "$GITHUB_OUTPUT"
          else
            password="$(openssl rand -hex 24)"
            echo "::add-mask::$password"
            keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$SIGNING_STORE_FILE" \
              -storepass "$password" -keypass "$password" -alias preview \
              -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=Stock Widget preview build"
            export SIGNING_STORE_PASSWORD="$password"
            export SIGNING_KEY_ALIAS=preview
            export SIGNING_KEY_PASSWORD="$password"
            echo "preview=true" >> "$GITHUB_OUTPUT"
          fi
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          rm -f "$SIGNING_STORE_FILE"

          apk="stock-widget-${TAG#v}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          cert="$("$apksigner" verify --print-certs "$apk" | grep -m 1 'SHA-256 digest' | awk '{print $NF}')"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "cert=$cert" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.build.outputs.apk }}
          CERT: ${{ steps.build.outputs.cert }}
          PREVIEW: ${{ steps.build.outputs.preview }}
        run: |
          {
            if [ "$PREVIEW" = "true" ]; then
              echo "**Preview build.** It's signed with a temporary key, so a later release can't update it in place: uninstall this one before installing a regular release."
              echo
            fi
            echo "Download \`$APK\` below and open it on your phone to install it (you may need to allow installing apps from your browser or file manager)."
            echo
            echo "Signing certificate SHA-256: \`$CERT\`"
            echo
            echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${TAG}/CHANGELOG.md) for what's new."
          } > notes.md
          flags=()
          if [ "$PREVIEW" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --title "Stock Widget ${TAG#v}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            "${flags[@]}"
