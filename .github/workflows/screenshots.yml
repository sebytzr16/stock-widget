name: Screenshots

# Takes the README and store screenshots on an emulator with sample data, and pushes them
# to the `screenshots` branch for review. Run it from the Actions tab.

on:
  workflow_dispatch:
  push:
    branches: ['claude/screenshots']

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Build the debug app
        run: ./gradlew --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -timezone America/New_York
          script: bash scripts/screenshots.sh

      - uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: error

      # The files are named for their place in the store listing and the README: 1.png, 2.png…
      - name: Push to the screenshots branch
        run: |
          dir=fastlane/metadata/android/en-US/images/phoneScreenshots
          mkdir -p "$dir"
          for f in screenshots/*.png; do cp "$f" "$dir/$(basename "$f" | cut -d- -f1).png"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B screenshots
          git add "$dir"
          git commit -m "Screenshots from ${GITHUB_SHA::7}"
          git push -f origin screenshots
